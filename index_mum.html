<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>🎄 Adventskalender 🎄</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('advent_hintergrund_ohne_zahlen.jpg') no-repeat center/cover;
      height: 100vh;
    }
    h1 { color:white; text-shadow:2px 2px 4px #000; margin:20px; text-align:center; }
    .calendar { position:relative; width:800px; height:600px; margin:0 auto; }
    .door { position:absolute; width:70px; height:70px; background:rgba(255,255,255,0.85);
      border-radius:8px; font-weight:bold; cursor:pointer; transition:transform 0.2s, background 0.2s;
      border:1px solid rgba(0,0,0,0.1); }
    .door:hover { background:linear-gradient(45deg,gold,orange); box-shadow:0 0 10px rgba(255,215,0,0.8);
      animation:wiggle 0.4s ease; }
    @keyframes wiggle { 0%{transform:scale(1.1);} 25%{transform:scale(1.1) rotate(-5deg);}
      50%{transform:scale(1.1) rotate(5deg);} 75%{transform:scale(1.1) rotate(-5deg);} 100%{transform:scale(1.1);} }
    .door:active { transform:scale(1.2) rotate(5deg); background:gold; box-shadow:0 0 15px gold; }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      max-width: 480px;       /* Breite wie gewünscht */
      width: 80%;
      max-height: 80vh;       /* Höhe begrenzen auf 80% der Bildschirmhöhe */
      overflow-y: auto;       /* Scrollbar bei langen Texten */
      text-align: left;
      display: none;
      z-index: 9999;
      border: 2px solid rgba(0,0,0,0.2);
      cursor: move;
      line-height: 1.5;
    }

    /* Schließen-Button */
    .close {
      margin-top: 16px;
      padding: 6px 12px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Bounce-Animation */
    .bounce { animation: bounce 0.6s; }
    @keyframes bounce {
      0%   { transform: translate(-50%, -50%) scale(0.9); }
      50%  { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* Bildbegrenzung */
    .popup img {
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
    }

    .popup-content { display:grid; grid-template-columns:240px 1fr; gap:16px; }
    @media(max-width:560px){ .popup-content{grid-template-columns:1fr;} }

    .flip-card { background:transparent; width:100%; max-width:600px; margin:0 auto; perspective:1000px; cursor:pointer; }
    .flip-card-inner { position:relative; width:100%; height:400px; transition:transform 1s; transform-style:preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform:rotateY(180deg); }

    .flip-card-front,
    .flip-card-back {
      position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:10px;
      box-sizing:border-box; padding:20px; overflow-y:auto;
    }
    .flip-card-front {
      background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    }
    .flip-card-front img { max-height:200px; object-fit:contain; margin-bottom:16px; border-radius:8px; }
    .flip-card-front p { text-align:left; margin:0; }
    .flip-card-back {
      background:#fdf6e3; color:#333; transform:rotateY(180deg); font-family:"Georgia",serif; line-height:1.4;
    }

    /* Sternenregen-Effekt */
    .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:9998; }
    .star {
  position: absolute;
  width: 16px;          /* doppelt so groß wie vorher */
  height: 16px;
  background: white;    /* ❄️ jetzt weiß statt gold */
  border-radius: 50%;
  animation: fall linear forwards;
  box-shadow: 0 0 12px white;   /* ❄️ weißer Glow */
}
   @keyframes fall {
  from { transform: translateY(-10px); opacity: 1; }
  to   { transform: translateY(100vh); opacity: 0; }
}

  </style>
</head>

    function openDoor(num){
      const door = contents[num]; 
      if(!door) return;
      const popupEl = document.getElementById("popup"); 
      popupEl.innerHTML = "";

      // Türchen 12 → normales Popup
      if(num === 12){
        popupEl.innerHTML = `
          <div class="popup-content">
            <div>${door.img ? `<img src="${door.img}">` : ""}</div>
            <div><p>${door.text}</p></div>
          </div>
          <button class="close" onclick="closePopup()">Schließen</button>`;
      }

      // Türchen 14 → Flip-Card mit Rückseite (3. Advent)
      else if(num === 14){
        popupEl.innerHTML = `
          <div class="flip-card" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-inner">
              <!-- Vorderseite -->
              <div class="flip-card-front">
                ${door.img ? `<img src="${door.img}" alt="Aquarell">` : ""}
                <p>${door.text}</p>
              </div>
              <!-- Rückseite -->
              <div class="flip-card-back">
                <p>
                  🎄 3. Advent – Die Geschichte vom dritten Lichtlein<br><br>
                  Am Morgen des dritten Adventssonntags war das Haus noch ganz still. 
                  Nur der Duft von Zimt und Orangen schlich sich durch die Räume, 
                  und draußen glitzerte der Frost wie feiner Puderzucker auf den Zweigen.<br><br>
                  Leggi zündete das dritte Lichtlein an – vorsichtig, fast feierlich. 
                  Drei Lichter, drei Wünsche, sagte er leise. Eins für Frieden, eins für Wärme, und eins für dich.<br><br>
                  Mum lächelte, legte ihm die Hand auf den Rücken und sagte: 
                  Dann fehlt nur noch das vierte – das für die Hoffnung.<br><br>
                  Sie saßen da, mit heißer Schokolade, Keksen, Decke und Wärmflasche 
                  und hörten, wie das Licht zu flüstern begann: 
                  „Es ist nicht wichtig, wie laut die Welt ist – solange ein Licht für dich brennt, ist alles gut.“<br><br>
                  ✨ „Drei Lichter, drei Wünsche…“
                </p>
              </div>
            </div>
          </div>
          <button class="close" onclick="closePopup()">Schließen</button>`;
      }

      // Türchen 21 → Flip-Card mit Rückseite (4. Advent)
      else if(num === 21){
        popupEl.innerHTML = `
          <div class="flip-card" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-inner">
              <!-- Vorderseite -->
              <div class="flip-card-front">
                ${door.img ? `<img src="${door.img}" alt="Aquarell">` : ""}
                <p>${door.text}</p>
              </div>
              <!-- Rückseite -->
              <div class="flip-card-back">
                <p>
                  🎄 4. Advent – Die Geschichte vom vierten Lichtlein<br><br>
                  Am Morgen des vierten Adventssonntags war die Stube schon voller Kerzenschein. 
                  Drei Flammen tanzten leise, und dann kam die vierte dazu – 
                  ein kleines Licht, das nicht nur Wärme brachte, sondern ein Augenzwinkern.<br><br>
                  „Ich bin die Hoffnung“, flüsterte die Kerze, 
                  „und ich bin stärker, als ihr manchmal glaubt. 
                  Ich halte euch durch die langen Nächte, ich trage euch über die stillen Tage, 
                  und ich erinnere euch: Bald ist Weihnachten, und alles wird hell.“<br><br>
                  Die Familie rückte näher zusammen, Tee dampfte in den Tassen, 
                  und draußen legte sich Schnee wie ein weißes Tuch über die Welt. 
                  Vier Lichter, vier Stimmen – und die vierte sang von Hoffnung, 
                  so klar, dass selbst die Stille lächelte.<br><br>
                  ✨ „Vier Lichter, vier Stimmen…“
                </p>
              </div>
            </div>
          </div>
          <button class="close" onclick="closePopup()">Schließen</button>`;
      }

      // Türchen 24 → Flip-Card + Sternenregen
      else if(num === 24){
        popupEl.innerHTML = `
          <div class="flip-card" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-inner">
              <!-- Vorderseite -->
              <div class="flip-card-front">
                ${door.img ? `<img src="${door.img}" alt="Aquarell">` : ""}
                <p>${door.text}</p>
              </div>
              <!-- Rückseite -->
              <div class="flip-card-back">
                <p>
                  Heiligabend legt sich wie ein sanfter Mantel über die Welt, draußen tanzen die Flocken, drinnen leuchtet das Feuer, und in allem spüre ich dich, Mum – mein Herz, mein Zuhause, mein Licht. Ich, dein Leggi, danke dir für jede stille Geste, für jedes Lächeln, das unser Leben heller macht, und für die Liebe, die uns trägt wie ein Stern durch die Nacht. Weihnachten ist mit dir kein Datum, sondern ein Versprechen: dass Wärme bleibt, dass Hoffnung wächst, dass wir Hand in Hand durch alle Zeiten gehen. Heute, am 24., möchte ich dir sagen: du bist mein größtes Geschenk, mein Frieden und mein Glück, und ich wünsche dir, dass dieses Fest dich umarmt wie ich es tue – mit all meiner Wärme, mit all meiner Liebe und meiner Wurzelnase, mit all meinem Herzen. Frohe Weihnachten, meine Mum.<br><br>
                  ✨ „Wo du bist, ist Weihnachten.“
                </p>
              </div>
            </div>
          </div>
          <button class="close" onclick="closePopup()">Schließen</button>`;

        // ⭐ Sternenregen erzeugen – neue, sichtbare Version
const starsContainer = document.createElement("div");
starsContainer.className = "stars";
document.body.appendChild(starsContainer);

// Anzahl der Sterne (kannst du erhöhen)
for (let i = 0; i < 80; i++) {

  const star = document.createElement("div");
  star.className = "star";

  // zufällige horizontale Position
  star.style.left = Math.random() * 100 + "vw";

  // langsamerer, schönerer Fall
  star.style.animationDuration = (4 + Math.random() * 4) + "s";

  starsContainer.appendChild(star);
}

// Sterne nach 7 Sekunden entfernen
setTimeout(() => starsContainer.remove(), 7000);
      }

      // Alle anderen Türchen → normales Popup
      else {
        popupEl.innerHTML = `
          <div class="popup-content">
            <div>${door.img ? `<img src="${door.img}">` : ""}</div>
            <div><p>${door.text}</p></div>
          </div>
          <button class="close" onclick="closePopup()">Schließen</button>`;
      }

      // Popup anzeigen mit Bounce-Effekt
      popupEl.style.display = "block";
      popupEl.style.top = "50%";
      popupEl.style.left = "50%";
      popupEl.style.transform = "translate(-50%, -50%)";
      popupEl.classList.add("bounce");
      setTimeout(() => popupEl.classList.remove("bounce"), 600);
    }

    function closePopup(){
      const popupEl = document.getElementById("popup");
      popupEl.style.display = "none"; 
      popupEl.innerHTML = "";
      popupEl.style.left = "50%";
      popupEl.style.transform = "translate(-50%, -50%)";
    }

    // Drag & Drop fürs Popup – nur wenn NICHT auf Flip-Card geklickt
    const popupEl = document.getElementById("popup");
    let isDragging = false, offsetX = 0, offsetY = 0;

    if(popupEl){
      popupEl.addEventListener("mousedown",(e)=>{
        // Wenn Klick auf Flip-Card oder deren Inhalt → kein Drag
        if(e.target.closest(".flip-card")) return;
        if(e.target.classList.contains("close")) return;

        isDragging = true;
        const rect = popupEl.getBoundingClientRect();
        offsetX = e.clientX - rect.left; 
        offsetY = e.clientY - rect.top;
        popupEl.style.transform = "none";
      });

      document.addEventListener("mousemove",(e)=>{
        if(!isDragging) return;
        popupEl.style.left = (e.clientX - offsetX) + "px";
        popupEl.style.top = (e.clientY - offsetY) + "px";
      });

      document.addEventListener("mouseup",()=>{isDragging=false;});
    }
  </script>
</body>
</html>
